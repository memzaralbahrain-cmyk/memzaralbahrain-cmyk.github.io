<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#1a237e"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Ledger Book 53</title>
<style>
:root{--bg:#f0f2f5;--card:#fff;--box:#f9f9f9;--txt:#222;--pri:#1a237e;--btn:#1a237e;--soft:#e8eaf6;--soft2:#f3f5fb;--line:#ddd;--mut:#666;--dis:#eee;--ok:#2e7d32;--bad:#c62828;--warn:#b26a00;}
:root[data-theme=dark]{--bg:#0f1115;--card:#181b22;--box:#1f232c;--txt:#e6e8ee;--pri:#7986cb;--btn:#3f51b5;--soft:#262b3a;--soft2:#20242f;--line:#39404f;--mut:#9aa1b2;--dis:#2a2e38;--ok:#66bb6a;--bad:#ef5350;--warn:#ffb74d;}
@media print{:root,:root[data-theme=dark]{--bg:#f0f2f5;--card:#fff;--box:#f9f9f9;--txt:#222;--pri:#1a237e;--btn:#1a237e;--soft:#e8eaf6;--soft2:#f3f5fb;--line:#ddd;--mut:#666;--dis:#eee;--ok:#2e7d32;--bad:#c62828;--warn:#b26a00;}}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Verdana,sans-serif}
body{background:var(--bg);color:var(--txt)}
.wrap{max-width:1000px;margin:0 auto;padding:16px;background:var(--card);min-height:100vh}
.head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;border-bottom:2px solid var(--pri);padding-bottom:10px;margin-bottom:16px}
.head h1{color:var(--pri);font-size:22px}.head span{color:var(--mut);font-size:13px;font-weight:bold}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.tile{border:2px solid var(--soft);border-radius:8px;padding:26px 10px;text-align:center;cursor:pointer;font-weight:bold;color:var(--pri);font-size:16px}
.tile:hover{border-color:var(--pri);background:var(--soft2)}
.box{background:var(--box);border:1px solid var(--line);padding:16px;border-radius:8px;max-width:560px;margin-bottom:20px}
.box h3{color:var(--pri);margin-bottom:12px}
.g{display:flex;flex-direction:column;margin-bottom:12px}
.g label{font-weight:bold;font-size:14px;margin-bottom:4px}
input,select{background:var(--card);color:var(--txt);padding:10px;border:1px solid var(--line);border-radius:4px;font-size:14px}
input:disabled{background:var(--dis);color:var(--mut)}
.r2{display:flex;gap:10px}.r2 .g{flex:1}
button{background:var(--btn);color:#fff;border:0;padding:11px 16px;border-radius:4px;font-size:15px;font-weight:bold;cursor:pointer;margin:0 6px 8px 0}
button.green{background:#2e7d32}button.red{background:#b71c1c}
.back{display:none;margin-bottom:12px}
.tg{margin:0;padding:8px 12px;font-size:13px}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid var(--line);padding:8px;font-size:14px;text-align:left}
th{background:var(--soft);color:var(--pri)}.n{text-align:right}
tr.t td{font-weight:bold;background:var(--soft)}tr.gp td{font-weight:bold;background:var(--soft2)}
.tab{display:none}.tab.on{display:block}
.msg{color:var(--ok);font-weight:bold;font-size:14px}.warn{color:var(--warn);font-size:13px;font-weight:bold;margin-bottom:10px}
.two{display:flex;flex-wrap:wrap;gap:10px}.two>div{flex:1;min-width:270px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.note{margin-top:10px;font-weight:bold}
.bar{margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media(max-width:700px){table{display:block;overflow-x:auto}}
@media print{.mw,.bar,.back,button{display:none!important}}
:root[data-color=ocean]{--pri:#0277bd;--soft:#e1f5fe;--soft2:#f0faff;--btn:#0277bd}
:root[data-color=ocean][data-theme=dark]{--pri:#4fc3f7;--soft:#1b2b36;--soft2:#18242d;--btn:#0277bd}
:root[data-color=green]{--pri:#2e7d32;--soft:#e8f5e9;--soft2:#f3faf3;--btn:#2e7d32}
:root[data-color=green][data-theme=dark]{--pri:#66bb6a;--soft:#1e2e21;--soft2:#1a271c;--btn:#2e7d32}
:root[data-color=purple]{--pri:#6a1b9a;--soft:#f3e5f5;--soft2:#faf2fb;--btn:#6a1b9a}
:root[data-color=purple][data-theme=dark]{--pri:#ba68c8;--soft:#2c2033;--soft2:#251c2b;--btn:#7b1fa2}
:root[data-color=orange]{--pri:#e65100;--soft:#fff3e0;--soft2:#fff9f0;--btn:#e65100}
:root[data-color=orange][data-theme=dark]{--pri:#ffb74d;--soft:#33271a;--soft2:#2a2016;--btn:#e65100}
:root[data-color=slate]{--pri:#37474f;--soft:#eceff1;--soft2:#f5f7f8;--btn:#455a64}
:root[data-color=slate][data-theme=dark]{--pri:#90a4ae;--soft:#2a2f33;--soft2:#22272a;--btn:#546e7a}
.mw{position:relative;display:flex;align-items:center}
.dots{margin:0;padding:4px 14px;font-size:24px;line-height:1;background:transparent;color:var(--pri);border:1px solid var(--line)}
.menu{display:none;position:absolute;right:0;top:100%;margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:8px;min-width:230px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:10;overflow:hidden}
.menu.open{display:block}
.menu div{padding:12px 14px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--line);color:var(--txt)}
.menu div:hover{background:var(--soft)}
.menu .mh{font-size:12px;color:var(--mut);font-weight:bold;cursor:default;background:var(--soft2)}
.menu .mh:hover{background:var(--soft2)}
.sw{display:inline-block;width:64px;text-align:center;margin:0 8px 10px 0;cursor:pointer;font-size:12px;color:var(--txt)}
.sw i{display:block;width:44px;height:44px;border-radius:50%;margin:0 auto 4px;border:3px solid transparent}
.sw.sel i{border-color:var(--txt)}
button.o{background:var(--soft);color:var(--pri)}
button.o.sel{background:var(--btn);color:#fff}
.sec{font-weight:bold;color:var(--pri);margin:14px 0 8px}
:root[data-size=small] .wrap{zoom:.92}
:root[data-size=large] .wrap{zoom:1.15}
:root[data-layout=list] .tiles{grid-template-columns:1fr}
:root[data-layout=list] .tile{padding:16px;text-align:left}
</style>
<script>
var UI={mode:'',color:'indigo',size:'normal',layout:'grid'};
(function(){try{var u=JSON.parse(localStorage.getItem('miniTallyUI'));if(u)for(var k in u)UI[k]=u[k]}catch(e){}
if(!UI.mode)UI.mode=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
applyUI()})();
function applyUI(){var r=document.documentElement;r.setAttribute('data-theme',UI.mode);r.setAttribute('data-color',UI.color);r.setAttribute('data-size',UI.size);r.setAttribute('data-layout',UI.layout)}
function setUI(k,v){UI[k]=v;applyUI();try{localStorage.setItem('miniTallyUI',JSON.stringify(UI))}catch(e){}draw('themes')}
</script>
</head>
<body>
<div class="wrap">
<div class="head"><h1 id="title">Ledger Book 53</h1><div class="mw"><span id="co" style="margin-right:10px"></span><button class="dots" onclick="menu(event)" aria-label="Menu">&#8942;</button>
<div class="menu" id="menu"><div class="mh">SETTINGS</div><div onclick="mgo('company')">Company Information</div><div onclick="mgo('themes')">Themes &amp; Interface</div><div onclick="mgo('backup')">Save / Backup</div></div></div></div>
<button class="back" id="back" onclick="go('home')">Back to Dashboard</button>
<div id="app"></div>
</div>
<script>
var LS='miniTally2', ok=true, D={ledgers:[],tx:[]};
try{var s=JSON.parse(localStorage.getItem(LS));if(s&&s.ledgers)D=s}catch(e){ok=false}
function co(){var c=D.company||{};return{name:c.name||'My Trading Co.',fy:c.fy||'2026-2027',addr:c.addr||'',phone:c.phone||'',gst:c.gst||''}}
function hdr(){$('co').innerText=co().name+' | FY '+co().fy}
function save(){try{localStorage.setItem(LS,JSON.stringify(D))}catch(e){alert('Auto-save not available. Please download a backup.')}}
var PL=['Sales Accounts','Purchase Accounts','Expenses'],CB=['Cash-in-Hand','Bank Accounts'];
var GROUPS=['Sundry Debtors','Sundry Creditors','Bank Accounts','Cash-in-Hand','Capital Account','Sales Accounts','Purchase Accounts','Expenses'];
var V={
sales:{t:'Sales Voucher',p:'Customer',f:function(l){return l.group=='Sundry Debtors'}},
purchase:{t:'Purchase Voucher',p:'Supplier',f:function(l){return l.group=='Sundry Creditors'}},
receipt:{t:'Receipt Voucher',p:'Received From',b:'Received In',f:function(l){return CB.indexOf(l.group)<0&&PL.indexOf(l.group)<0}},
payment:{t:'Payment Voucher',p:'Paid To',b:'Paid From',f:function(l){return CB.indexOf(l.group)<0&&PL.indexOf(l.group)<0}},
expense:{t:'Expenses',p:'Expense Ledger',b:'Paid From',f:function(l){return l.group=='Expenses'}}};
var TITLES={company:'Company Information',themes:'Themes & Interface',home:'Dashboard',ledger:'Create Ledger',daybook:'Day Book',pl:'Profit & Loss',bs:'Balance Sheet',tb:'Trial Balance',backup:'Save / Backup'};
function $(i){return document.getElementById(i)}
function v(i){return $(i).value}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmt(n){return Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function fd(i){var p=String(i).split('-');return p.length==3?p[2]+'/'+p[1]+'/'+p[0]:i}
function grp(n){var l=D.ledgers.find(function(x){return x.name==n});return l?l.group:'Other'}
function bal(t){return Math.abs(t)<0.005?'0.00':(t>0?fmt(t)+' Dr':fmt(-t)+' Cr')}
function flash(m){var e=$('msg');if(e){e.innerText=m;setTimeout(function(){e.innerText=''},3000)}}
function opts(list,ph){return '<option value="">'+ph+'</option>'+list.map(function(n){return '<option value="'+esc(n)+'">'+esc(n)+'</option>'}).join('')}
function names(f){return D.ledgers.filter(f).map(function(l){return l.name})}

function books(from,to){
 var b={},sales=0,pur=0,diff=0;
 D.ledgers.forEach(function(l){var o=parseFloat(l.opening)||0,x=0;if(PL.indexOf(l.group)<0){x=l.type=='Cr'?-o:o;diff+=x}b[l.name]=x});
 function a(n,x){b[n]=(b[n]||0)+x}
 D.tx.forEach(function(t){
  if(from&&t.date<from)return;if(to&&t.date>to)return;var m=t.amount;
  if(t.type=='sales'){a(t.party,m);sales+=m}
  else if(t.type=='purchase'){a(t.party,-m);pur+=m}
  else if(t.type=='receipt'){a(t.bank,m);a(t.party,-m)}
  else{a(t.party,m);a(t.bank,-m)}});
 var ex=0;Object.keys(b).forEach(function(n){if(grp(n)=='Expenses')ex+=b[n]});
 return{b:b,sales:sales,pur:pur,diff:diff,profit:sales-pur-ex};
}

function go(t){if(location.hash.slice(1)==t)draw(t);else location.hash=t}
window.onhashchange=function(){draw(location.hash.slice(1)||'home')};
function draw(t){
 var h='';
 if(V[t]){t=t;h=voucher(t);$('title').innerText=V[t].t}
 else{if(!TITLES[t])t='home';$('title').innerText=TITLES[t];h=({company:company,themes:themes,home:home,ledger:ledger,daybook:daybook,pl:pl,bs:bs,tb:tb,backup:backup})[t]()}
 $('app').innerHTML=h;$('back').style.display=t=='home'?'none':'inline-block';window.scrollTo(0,0);hdr();
 if(t=='ledger')gc();
 if(t=='pl')rpl();if(t=='bs')rbs();if(t=='tb')rtb();
}

function home(){
 var items=[['ledger','Create Ledger'],['sales','Sales Voucher'],['purchase','Purchase Voucher'],['receipt','Receipt Voucher'],['payment','Payment Voucher'],['expense','Expenses'],['daybook','Day Book'],['pl','Profit & Loss'],['bs','Balance Sheet'],['tb','Trial Balance'],['backup','Save / Backup']];
 return '<div class="tiles">'+items.map(function(i){return '<div class="tile" onclick="go(\''+i[0]+'\')">'+i[1].replace('&','&amp;')+'</div>'}).join('')+'</div>';
}

function ledger(){
 var rows=D.ledgers.length?(function(){var B=books('','').b;return D.ledgers.map(function(l){var o=parseFloat(l.opening)||0;return '<tr><td>'+esc(l.name)+'</td><td>'+esc(l.group)+'</td><td class="n">'+(o?fmt(o)+' '+l.type:'-')+'</td><td class="n">'+bal(B[l.name]||0)+'</td></tr>'}).join('')})():'<tr><td colspan="4">No ledgers yet</td></tr>';
 return '<div class="box"><h3>Create New Ledger</h3><div class="g"><label>Ledger Name</label><input id="ln" placeholder="e.g. Rahul Sharma, SBI Bank, Office Rent"></div>'+
 '<div class="g"><label>Under Group</label><select id="lg" onchange="gc()">'+GROUPS.map(function(g){return '<option>'+g+'</option>'}).join('')+'</select></div>'+
 '<div class="r2"><div class="g"><label>Opening Balance</label><input type="number" step="0.01" id="lo"></div><div class="g"><label>Dr / Cr</label><select id="lt"><option>Dr</option><option>Cr</option></select></div></div>'+
 '<button onclick="mk()">Create Ledger</button><div class="msg" id="msg"></div></div><h3>Existing Ledgers</h3><table><tr><th>Name</th><th>Group</th><th class="n">Opening</th><th class="n">Balance</th></tr>'+rows+'</table>';
}
function gc(){var g=v('lg'),off=PL.indexOf(g)>=0;$('lo').disabled=off;$('lt').disabled=off;if(off)$('lo').value='';$('lt').value=(g=='Sundry Creditors'||g=='Capital Account')?'Cr':'Dr'}
function mk(){
 var n=v('ln').trim(),g=v('lg'),o=parseFloat(v('lo'))||0;
 if(!n){alert('Enter ledger name');return}
 if(o<0){alert('Opening balance cannot be negative. Use Dr / Cr.');return}
 if(D.ledgers.some(function(l){return l.name.toLowerCase()==n.toLowerCase()})){alert('Ledger already exists');return}
 D.ledgers.push({name:n,group:g,opening:PL.indexOf(g)>=0?0:o,type:v('lt')});save();draw('ledger');flash('Ledger created.');
}

function voucher(t){
 var c=V[t],cb=names(function(l){return CB.indexOf(l.group)>=0}),p=names(c.f),w='';
 if(c.b&&!cb.length)w='First create a Cash-in-Hand or Bank Accounts ledger.';
 else if(!p.length)w='First create a ledger for: '+c.p+'.';
 return '<div class="box"><h3>'+c.t+'</h3><div class="warn">'+w+'</div><div class="g"><label>Date</label><input type="date" id="d" value="'+today()+'"></div>'+
 (c.b?'<div class="g"><label>'+c.b+'</label><select id="b">'+opts(cb,'-- Select --')+'</select></div>':'')+
 '<div class="g"><label>'+c.p+'</label><select id="p">'+opts(p,'-- Select --')+'</select></div>'+
 '<div class="g"><label>Amount</label><input type="number" step="0.01" id="a"></div><div class="g"><label>Narration</label><input id="nr"></div>'+
 '<button onclick="vs(\''+t+'\')">Save</button><div class="msg" id="msg"></div></div>';
}
function vs(t){
 var c=V[t],d=v('d'),p=v('p'),b=c.b?v('b'):'',a=parseFloat(v('a'));
 if(!d||!p||(c.b&&!b)||!(a>0)){alert('Please fill all fields correctly.');return}
 D.tx.push({date:d,type:t,party:p,bank:b,amount:a,narration:v('nr').trim()});save();
 $('a').value='';$('nr').value='';flash('Entry saved.');
}

function daybook(){
 var r=D.tx.length?D.tx.slice().sort(function(a,b){return a.date<b.date?1:-1}).map(function(t){return '<tr><td>'+fd(t.date)+'</td><td>'+V[t.type].t+'</td><td><b>'+esc(t.party)+'</b></td><td>'+esc(t.bank||'-')+'</td><td class="n">'+fmt(t.amount)+'</td><td>'+esc(t.narration||'-')+'</td></tr>'}).join(''):'<tr><td colspan="6">No transactions yet</td></tr>';
 return '<div class="bar"><button onclick="csv()">Download Excel (CSV)</button><button class="green" onclick="window.print()">Print / Save as PDF</button></div><table><tr><th>Date</th><th>Type</th><th>Particulars</th><th>Cash / Bank</th><th class="n">Amount</th><th>Narration</th></tr>'+r+'</table>';
}
function csv(){
 if(!D.tx.length){alert('No transactions yet.');return}
 var q=function(x){return '"'+String(x==null?'':x).replace(/"/g,'""')+'"'};
 var L=['Date,Type,Particulars,Cash/Bank,Amount,Narration'];
 D.tx.slice().sort(function(a,b){return a.date<b.date?-1:1}).forEach(function(t){L.push([q(fd(t.date)),q(V[t.type].t),q(t.party),q(t.bank),t.amount,q(t.narration)].join(','))});
 dl('DayBook_'+today()+'.csv','\ufeff'+L.join('\n'),'text/csv;charset=utf-8');
}

function bar(id,lab,fn){return '<div class="bar">'+lab+' <input type="date" id="'+id+'" onchange="'+fn+'()">'+(id=='pf'?' To <input type="date" id="pt" onchange="rpl()">':'')+'<button class="green" onclick="window.print()">Print / Save as PDF</button></div>'}
function hd(t,s){var c=co(),x=[c.addr,c.phone?'Ph: '+c.phone:'',c.gst?'GST/Tax No: '+c.gst:''].filter(Boolean).map(esc).join(' | ');return '<h3 style="text-align:center;color:var(--pri)">'+esc(c.name)+'</h3>'+(x?'<p style="text-align:center;color:var(--mut);font-size:13px">'+x+'</p>':'')+'<h3 style="text-align:center;color:var(--pri)">'+t+'</h3><p style="text-align:center;color:var(--mut);font-size:13px">'+s+'</p>'}
function row(l,a,c){return '<tr class="'+(c||'')+'"><td>'+l+'</td><td class="n">'+(a===''?'':fmt(a))+'</td></tr>'}
function pl(){return bar('pf','From','rpl')+'<div id="out"></div>'}
function bs(){return bar('bt','As on','rbs')+'<div id="out"></div>'}
function tb(){return bar('tt','As on','rtb')+'<div id="out"></div>'}

function rpl(){
 var f=v('pf'),t=v('pt'),k=books(f,t),L=row('To Purchase Accounts',k.pur),R=row('By Sales Accounts',k.sales),dr=k.pur,cr=k.sales;
 Object.keys(k.b).forEach(function(n){if(grp(n)!='Expenses')return;var x=k.b[n];if(Math.abs(x)<0.005)return;if(x>0){L+=row('To '+esc(n),x);dr+=x}else{R+=row('By '+esc(n),-x);cr-=x}});
 if(k.profit>0){L+=row('To Net Profit',k.profit);dr+=k.profit}
 if(k.profit<0){R+=row('By Net Loss',-k.profit);cr-=k.profit}
 $('out').innerHTML=hd('Profit &amp; Loss A/c',(!f&&!t)?'All dates':(f?fd(f):'Start')+' to '+(t?fd(t):'Today'))+
 '<div class="two"><div><table><tr><th>Particulars (Dr)</th><th class="n">Amount</th></tr>'+L+row('Total',dr,'t')+'</table></div><div><table><tr><th>Particulars (Cr)</th><th class="n">Amount</th></tr>'+R+row('Total',cr,'t')+'</table></div></div>'+
 '<div class="note '+(k.profit>=0?'ok':'bad')+'">'+(k.profit>=0?'Net Profit: ':'Net Loss: ')+fmt(Math.abs(k.profit))+'</div>';
}
function rtb(){
 var t=v('tt'),k=books('',t),dr=0,cr=0,r='';
 Object.keys(k.b).forEach(function(n){var x=k.b[n];if(Math.abs(x)<0.005)return;var d=x>0?x:0,c=x<0?-x:0;dr+=d;cr+=c;r+='<tr><td>'+esc(n)+' <small style="color:var(--mut)">('+esc(grp(n))+')</small></td><td class="n">'+(d?fmt(d):'')+'</td><td class="n">'+(c?fmt(c):'')+'</td></tr>'});
 function x(l,d,c){dr+=d;cr+=c;r+='<tr><td>'+l+'</td><td class="n">'+(d?fmt(d):'')+'</td><td class="n">'+(c?fmt(c):'')+'</td></tr>'}
 if(k.sales)x('Sales Accounts',0,k.sales);if(k.pur)x('Purchase Accounts',k.pur,0);
 if(k.diff>0.005)x('Difference in Opening Balances',0,k.diff);if(k.diff<-0.005)x('Difference in Opening Balances',-k.diff,0);
 if(!r)r='<tr><td colspan="3">No data yet</td></tr>';
 var ty=Math.abs(dr-cr)<0.005;
 $('out').innerHTML=hd('Trial Balance','As on: '+(t?fd(t):'All dates'))+'<table><tr><th>Particulars</th><th class="n">Debit</th><th class="n">Credit</th></tr>'+r+'<tr class="t"><td>Grand Total</td><td class="n">'+fmt(dr)+'</td><td class="n">'+fmt(cr)+'</td></tr></table><div class="note '+(ty?'ok':'bad')+'">'+(ty?'Trial Balance is tallied.':'Difference: '+fmt(Math.abs(dr-cr)))+'</div>';
}
function rbs(){
 var t=v('bt'),k=books('',t),A={},Li={},at=0,lt=0;
 Object.keys(k.b).forEach(function(n){var x=k.b[n],g=grp(n);if(Math.abs(x)<0.005||PL.indexOf(g)>=0)return;if(x>0){(A[g]=A[g]||[]).push([n,x]);at+=x}else{(Li[g]=Li[g]||[]).push([n,-x]);lt-=x}});
 function side(m,e){var h='';Object.keys(m).forEach(function(g){h+=row(esc(g),m[g].reduce(function(a,y){return a+y[1]},0),'gp');m[g].forEach(function(y){h+=row('&nbsp;&nbsp;'+esc(y[0]),y[1])})});return h+e}
 var lx='',ax='';
 if(k.diff>0.005){lx+=row('Difference in Opening Balances',k.diff,'gp');lt+=k.diff}
 if(k.diff<-0.005){ax+=row('Difference in Opening Balances',-k.diff,'gp');at-=k.diff}
 if(k.profit>0.005){lx+=row('Profit &amp; Loss A/c (Net Profit)',k.profit,'gp');lt+=k.profit}
 if(k.profit<-0.005){ax+=row('Profit &amp; Loss A/c (Net Loss)',-k.profit,'gp');at-=k.profit}
 var ty=Math.abs(lt-at)<0.005;
 $('out').innerHTML=hd('Balance Sheet','As on: '+(t?fd(t):'All dates'))+'<div class="two"><div><table><tr><th>Liabilities</th><th class="n">Amount</th></tr>'+side(Li,lx)+row('Total',lt,'t')+'</table></div><div><table><tr><th>Assets</th><th class="n">Amount</th></tr>'+side(A,ax)+row('Total',at,'t')+'</table></div></div><div class="note '+(ty?'ok':'bad')+'">'+(ty?'Balance Sheet is tallied.':'Difference: '+fmt(Math.abs(lt-at)))+'</div>';
}

function menu(e){e.stopPropagation();$('menu').classList.toggle('open')}
document.addEventListener('click',function(){var m=$('menu');if(m)m.classList.remove('open')});
function mgo(t){$('menu').classList.remove('open');go(t)}
function company(){
 var c=co();
 return '<div class="box"><h3>Company Information</h3><div class="g"><label>Company Name</label><input id="cn" value="'+esc(c.name)+'"></div>'+
 '<div class="g"><label>Financial Year</label><input id="cf" value="'+esc(c.fy)+'" placeholder="e.g. 2026-2027"></div>'+
 '<div class="g"><label>Address</label><input id="ca" value="'+esc(c.addr)+'"></div>'+
 '<div class="g"><label>Phone</label><input id="cp" value="'+esc(c.phone)+'"></div>'+
 '<div class="g"><label>GST / Tax Number</label><input id="cg" value="'+esc(c.gst)+'"></div>'+
 '<button onclick="sco()">Save Information</button><div class="msg" id="msg"></div></div>';
}
function sco(){
 var n=v('cn').trim();if(!n){alert('Enter company name');return}
 D.company={name:n,fy:v('cf').trim(),addr:v('ca').trim(),phone:v('cp').trim(),gst:v('cg').trim()};save();hdr();flash('Information saved.');
}
function themes(){
 var C=[['indigo','Indigo','#1a237e'],['ocean','Ocean','#0277bd'],['green','Green','#2e7d32'],['purple','Purple','#6a1b9a'],['orange','Orange','#e65100'],['slate','Slate','#455a64']];
 function opt(k,val,lab){return '<button class="o'+(UI[k]==val?' sel':'')+'" onclick="setUI(\''+k+'\',\''+val+'\')">'+lab+'</button>'}
 return '<div class="box"><h3>Themes &amp; Interface</h3><div class="sec">Colour Theme</div>'+
 C.map(function(c){return '<div class="sw'+(UI.color==c[0]?' sel':'')+'" onclick="setUI(\'color\',\''+c[0]+'\')"><i style="background:'+c[2]+'"></i>'+c[1]+'</div>'}).join('')+
 '<div class="sec">Mode</div>'+opt('mode','light','Light')+opt('mode','dark','Dark')+
 '<div class="sec">Text Size</div>'+opt('size','small','Small')+opt('size','normal','Normal')+opt('size','large','Large')+
 '<div class="sec">Dashboard Layout</div>'+opt('layout','grid','Grid')+opt('layout','list','List')+
 '<p style="font-size:13px;color:var(--mut);margin-top:10px">Changes apply instantly and are remembered on this device.</p></div>';
}
function backup(){
 return '<div class="box"><h3>Save / Backup</h3><p style="font-size:13px;margin-bottom:12px">Data is saved automatically in this browser. Clearing browser data or changing device can erase it, so download a backup regularly.</p>'+
 '<button onclick="bk()">Download Backup File</button><button class="green" onclick="$(\'rf\').click()">Restore from Backup File</button><button class="red" onclick="clr()">Delete All Data</button>'+
 '<input type="file" id="rf" accept=".json" style="display:none" onchange="rs(event)"><div class="msg" id="msg"></div></div>';
}
function dl(n,tx,m){var u=URL.createObjectURL(new Blob([tx],{type:m})),a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(u)},500)}
function bk(){dl('LedgerBook53_Backup_'+today()+'.json',JSON.stringify(D,null,2),'application/json');flash('Backup downloaded.')}
function rs(e){
 var f=e.target.files[0];if(!f)return;var r=new FileReader();
 r.onload=function(){try{var d=JSON.parse(r.result);if(!Array.isArray(d.ledgers)||!Array.isArray(d.tx))throw 1;if(!confirm('Current data will be replaced. Continue?'))return;D=d;save();hdr();flash('Data restored.')}catch(x){alert('Not a valid backup file. (Backups from the older version are not compatible.)')}};
 r.readAsText(f);e.target.value='';
}
function clr(){if(!confirm('All data will be deleted. Are you sure?'))return;D={ledgers:[],tx:[],company:D.company};save();flash('All data deleted.')}
draw(location.hash.slice(1)||'home');
if('serviceWorker' in navigator){window.addEventListener('load',function(){try{navigator.serviceWorker.register('sw.js')}catch(e){}})}
</script>
